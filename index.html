<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Monitoramento - Help Desk</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f6f8fd 0%, #f1f5f9 100%);
            margin: 0;
            padding: 40px 20px;
            color: #334155;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .dashboard-container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
        }
        h1 {
            text-align: center;
            color: #1e293b;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 10px;
        }
        th, td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid #f1f5f9;
        }
        th {
            background-color: #f8fafc;
            color: #64748b;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        th:first-child { border-top-left-radius: 12px; border-bottom-left-radius: 12px; }
        th:last-child { border-top-right-radius: 12px; border-bottom-right-radius: 12px; }
        tr:hover td {
            background-color: #f8fafc;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-aguardando {
            background-color: #fef3c7;
            color: #d97706;
        }
        .status-caminho {
            background-color: #d1fae5;
            color: #059669;
        }
        .refresh-aviso {
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            margin-top: 25px;
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <h1>Monitoramento Global de Chamados</h1>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Máquina / Local</th>
            <th>Responsável</th>
            <th>Descrição do Problema</th>
            <th>Status Atual</th>
        </tr>
        </thead>
        <tbody id="tabela-corpo">
        <!-- Os dados serão injetados aqui via JavaScript -->
        </tbody>
    </table>

    <div class="refresh-aviso">
        Atualizando automaticamente em tempo real...
    </div>
</div>

<script>
    async function carregarChamados() {
        try {
            const response = await fetch('/api/chamados/todos');
            const chamados = await response.json();

            const tbody = document.getElementById('tabela-corpo');
            tbody.innerHTML = '';

            if (chamados.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#94a3b8; padding: 30px;">Nenhum chamado ativo no momento.</td></tr>';
                return;
            }

            chamados.forEach(chamado => {
                const tr = document.createElement('tr');

                let badgeClass = chamado.status === 'AGUARDANDO' ? 'status-aguardando' : 'status-caminho';
                let statusTexto = chamado.status === 'AGUARDANDO' ? 'Aguardando' : 'A Caminho';
                let idResumido = chamado.id.substring(chamado.id.length - 6);

                tr.innerHTML = `
                        <td style="font-weight: 600; color: #6366f1;">#${idResumido}</td>
                        <td>${chamado.maquina}</td>
                        <td>${chamado.adminDestino}</td>
                        <td>${chamado.problema}</td>
                        <td><span class="status-badge ${badgeClass}">${statusTexto}</span></td>
                    `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            console.error("Erro ao buscar chamados:", error);
        }
    }

    carregarChamados();
    setInterval(carregarChamados, 3000);
</script>
</body>
</html>
