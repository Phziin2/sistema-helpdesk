<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suporte Técnico</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f6f8fd 0%, #f1f5f9 100%); min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .container { background: #ffffff; padding: 40px 30px; border-radius: 24px; width: 100%; max-width: 460px; box-shadow: 0 20px 40px rgba(0,0,0,0.06); overflow: hidden; position: relative; }
        h2 { color: #1e293b; margin-top: 0; font-weight: 700; font-size: 22px; text-align: center; margin-bottom: 25px; }
        .subtitle { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 20px; font-weight: 500; }
        .step { display: none; animation: fadeIn 0.4s ease forwards; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }

        .grid-admins { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .grid-clientes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .grid-setores { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .btn-admin { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: white; border: none; padding: 20px 10px; border-radius: 16px; font-weight: 600; font-size: 15px; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25); display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .btn-admin:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 8px 16px rgba(79, 70, 229, 0.4); }
        .btn-admin:disabled { background: #cbd5e1; color: #94a3b8; cursor: not-allowed; box-shadow: none; transform: none; }

        .btn-cliente { background: #f8fafc; border: 2px solid #e2e8f0; color: #334155; padding: 16px 10px; border-radius: 12px; font-weight: 600; font-size: 15px; cursor: pointer; transition: all 0.2s ease; }
        .btn-cliente:hover { border-color: #6366f1; color: #6366f1; background: #eef2ff; transform: translateY(-2px); }

        .btn-setor { background: #ffffff; border: 2px solid #e2e8f0; color: #334155; padding: 30px 10px; border-radius: 16px; font-weight: 700; font-size: 18px; cursor: pointer; transition: all 0.2s ease; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .btn-setor.entrada:hover { border-color: #10b981; color: #10b981; background: #ecfdf5; transform: translateY(-3px); box-shadow: 0 8px 16px rgba(16, 185, 129, 0.15); }
        .btn-setor.saida:hover { border-color: #f43f5e; color: #f43f5e; background: #fff1f2; transform: translateY(-3px); box-shadow: 0 8px 16px rgba(244, 63, 94, 0.15); }

        /* AQUI: Fonte da caixa de texto aumentada para 18px */
        textarea { width: 100%; padding: 16px; border: 2px solid #e2e8f0; border-radius: 12px; font-family: 'Inter', sans-serif; font-size: 18px; color: #334155; transition: all 0.3s ease; box-sizing: border-box; background-color: #f8fafc; margin-bottom: 20px; resize: none; }
        textarea:focus { border-color: #6366f1; outline: none; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); background-color: #ffffff; }

        .btn-enviar { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; border: none; padding: 16px; border-radius: 12px; width: 100%; font-weight: 600; font-size: 16px; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25); }
        .btn-enviar:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4); }

        .btn-voltar { background: none; border: none; color: #64748b; font-size: 14px; font-weight: 600; cursor: pointer; padding: 0; margin-bottom: 15px; display: flex; align-items: center; gap: 5px; }
        .btn-voltar:hover { color: #1e293b; }

        .resumo { background: #f8fafc; padding: 12px; border-radius: 8px; font-size: 13px; color: #475569; margin-bottom: 20px; text-align: center; border: 1px dashed #cbd5e1; }
        .resumo span { font-weight: 700; color: #6366f1; }
    </style>
</head>
<body>
<div class="container">
    <!-- PASSO 1 -->
    <div id="step-1" class="step active">
        <h2>Central de Suporte</h2>
        <div class="subtitle">Qual departamento você deseja acionar?</div>
        <div class="grid-admins">
            <button id="btn-Eletrica" class="btn-admin" onclick="selecionarAdmin('Elétrica', 'btn-Eletrica')"><span style="font-size: 24px;">⚡</span> Elétrica</button>
            <button id="btn-Mecanica" class="btn-admin" onclick="selecionarAdmin('Mecânica', 'btn-Mecanica')"><span style="font-size: 24px;">🔧</span> Mecânica</button>
            <button id="btn-Coordenador" class="btn-admin" onclick="selecionarAdmin('Coordenador', 'btn-Coordenador')"><span style="font-size: 24px;">👷‍♂️</span> Coordenador</button>
            <button id="btn-Qualidade" class="btn-admin" onclick="selecionarAdmin('Qualidade', 'btn-Qualidade')"><span style="font-size: 24px;">🔎</span> Qualidade</button>
        </div>
    </div>

    <!-- PASSO 2 -->
    <div id="step-2" class="step">
        <button class="btn-voltar" onclick="irParaPasso(1)">← Voltar</button>
        <h2>Equipamento</h2>
        <div class="subtitle">Em qual máquina você está?</div>
        <div class="grid-clientes" id="lista-maquinas"></div>
    </div>

    <!-- PASSO 3 -->
    <div id="step-3" class="step">
        <button class="btn-voltar" onclick="irParaPasso(2)">← Voltar</button>
        <h2>Localização do Problema</h2>
        <div class="subtitle">Em qual parte da <span id="lbl-maquina-passo3" style="font-weight: 700; color: #6366f1;"></span> está o problema?</div>
        <div class="grid-setores">
            <button class="btn-setor entrada" onclick="selecionarSetor('Entrada')"><span style="font-size: 28px;">🟢</span> Entrada</button>
            <button class="btn-setor saida" onclick="selecionarSetor('Saída')"><span style="font-size: 28px;">🔴</span> Saída</button>
        </div>
    </div>

    <!-- PASSO 4 -->
    <div id="step-4" class="step">
        <button class="btn-voltar" onclick="irParaPasso(3)">← Voltar</button>
        <h2>Detalhes do Problema</h2>
        <div class="resumo">Chamando: <span id="lbl-admin">...</span> <br>Local: <span id="lbl-cliente">...</span></div>
        <textarea id="problema" rows="4" placeholder="Ex: Atolamento de papel, painel elétrico, falha de registro..."></textarea>
        <button class="btn-enviar" onclick="enviarChamadoFinal()">🚀 Enviar Chamado</button>
    </div>
</div>

<script>
    let chamadosAtivos = JSON.parse(localStorage.getItem('chamadosAtivos')) || {};
    let timerMonitoramento = null;
    let fluxoAtual = { admin: '', btnAdminId: '', maquinaBase: '', setor: '', clienteFinal: '' };

    const maquinas = ["Lito 7", "Lito 6", "Lito 15", "Lito 19", "Lito 18", "Impressora"];
    const gradeMaquinas = document.getElementById('lista-maquinas');
    maquinas.forEach(nome => {
        let btn = document.createElement('button');
        btn.className = 'btn-cliente';
        btn.innerText = nome;
        btn.onclick = () => selecionarMaquina(nome);
        gradeMaquinas.appendChild(btn);
    });

    function verificarMemoria() {
        const adminsEmAtendimento = Object.keys(chamadosAtivos);
        if (adminsEmAtendimento.length > 0) {
            adminsEmAtendimento.forEach(admin => {
                const btn = document.getElementById(chamadosAtivos[admin].botaoId);
                if (btn) {
                    btn.disabled = true;
                    btn.innerHTML = `⏳ Aguardando...`;
                }
            });
            iniciarMonitoramento();
        }
    }

    verificarMemoria();

    function irParaPasso(passo) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById(`step-${passo}`).classList.add('active');
    }

    function selecionarAdmin(nomeAdmin, btnId) {
        if (chamadosAtivos[nomeAdmin]) {
            alert(`Você já tem um chamado em andamento aguardando a equipe de ${nomeAdmin}.`);
            return;
        }
        fluxoAtual.admin = nomeAdmin;
        fluxoAtual.btnAdminId = btnId;
        document.getElementById('lbl-admin').innerText = nomeAdmin;
        irParaPasso(2);
    }

    function selecionarMaquina(nomeMaquina) {
        fluxoAtual.maquinaBase = nomeMaquina;
        document.getElementById('lbl-maquina-passo3').innerText = nomeMaquina;
        irParaPasso(3);
    }

    function selecionarSetor(nomeSetor) {
        fluxoAtual.setor = nomeSetor;
        fluxoAtual.clienteFinal = `${fluxoAtual.maquinaBase} - ${nomeSetor}`;
        document.getElementById('lbl-cliente').innerText = fluxoAtual.clienteFinal;
        irParaPasso(4);
    }

    async function enviarChamadoFinal() {
        const problemaEl = document.getElementById('problema');
        const problema = problemaEl.value.trim();
        if (!problema) { alert('Por favor, descreva o problema!'); problemaEl.focus(); return; }

        const admin = fluxoAtual.admin;
        const btn = document.getElementById(fluxoAtual.btnAdminId);

        // AQUI: A Janela de confirmação em duas etapas
        const mensagemConfirmacao = `Confirme os dados do chamado:\n\n🛠️ Departamento: ${admin}\n📍 Máquina: ${fluxoAtual.clienteFinal}\n⚠️ Problema: ${problema}\n\nDeseja realmente enviar este chamado?`;

        if (!confirm(mensagemConfirmacao)) {
            return; // Se o usuário clicar em "Cancelar", a função para aqui e não envia.
        }

        try {
            const response = await fetch('/api/chamados/abrir', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminDestino: admin, maquina: fluxoAtual.clienteFinal, problema: problema })
            });

            const id = await response.text();

            chamadosAtivos[admin] = { id: id, botaoId: fluxoAtual.btnAdminId };
            localStorage.setItem('chamadosAtivos', JSON.stringify(chamadosAtivos));

            btn.disabled = true;
            btn.innerHTML = `⏳ Aguardando...`;

            problemaEl.value = '';
            irParaPasso(1);
            iniciarMonitoramento();

        } catch (error) { alert('Erro de conexão com o servidor.'); }
    }

    function iniciarMonitoramento() {
        if (timerMonitoramento) return;
        timerMonitoramento = setInterval(async () => {
            const adminsEmAtendimento = Object.keys(chamadosAtivos);

            if (adminsEmAtendimento.length === 0) {
                clearInterval(timerMonitoramento);
                timerMonitoramento = null;
                return;
            }

            for (let admin of adminsEmAtendimento) {
                const dados = chamadosAtivos[admin];
                try {
                    const response = await fetch(`/api/chamados/status/${dados.id}`);
                    if (response.ok) {
                        const status = await response.text();
                        if (status === 'A_CAMINHO') {
                            alert(`Boas notícias! A equipe de ${admin} já atendeu o chamado e ESTÁ A CAMINHO!`);

                            const btn = document.getElementById(dados.botaoId);
                            if(btn) {
                                btn.disabled = false;
                                let emoji = '⚡';
                                if(admin === 'Mecânica') emoji = '🔧';
                                if(admin === 'Coordenador') emoji = '👷‍♂️';
                                if(admin === 'Qualidade') emoji = '🔎';
                                btn.innerHTML = `<span style="font-size: 24px;">${emoji}</span> ${admin}`;
                            }

                            delete chamadosAtivos[admin];
                            localStorage.setItem('chamadosAtivos', JSON.stringify(chamadosAtivos));
                        }
                    }
                } catch (error) { console.error("Erro na sincronização", error); }
            }
        }, 3000);
    }
</script>
</body>
</html>
